name: repo-hygiene

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: 固件 / 密钥 / 脱敏检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 运行仓库卫生检查
        run: python scripts/check_repo_hygiene.py --path .

      - name: 检查大文件（>2 MiB 非图片）
        run: |
          set -e
          bad=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.png) continue ;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -gt 2097152 ]; then
              echo "::error file=$f::文件过大（$size 字节），可能是固件或数据文件"
              bad=1
            fi
          done < <(find . -type f -not -path './.git/*' -print0)
          exit $bad
